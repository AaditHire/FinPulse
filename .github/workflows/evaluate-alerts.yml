name: FinPulse Alert Evaluation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finpulse-alert-evaluation
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate approved research alerts
        env:
          APP_URL: ${{ secrets.FINPULSE_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 2 --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/internal/alerts/evaluate"
